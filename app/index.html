<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UNLaM-Gym">
<title>UNLaM-Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- HOY -->
  <section class="screen" data-screen="hoy">
    <header class="topbar">
      <h1 class="title">Hoy</h1>
      <span class="meta" id="hoyDate"></span>
    </header>
    <div class="content" id="hoyContent"></div>
  </section>

  <!-- RUTINA -->
  <section class="screen" data-screen="rutina" hidden>
    <header class="topbar">
      <h1 class="title">Mi rutina</h1>
      <span class="meta">7 días</span>
    </header>
    <div class="content" id="rutinaContent"></div>
  </section>

  <!-- CALENDARIO -->
  <section class="screen" data-screen="calendario" hidden>
    <header class="topbar">
      <h1 class="title">Calendario</h1>
      <span class="meta"></span>
    </header>
    <div class="content" id="calContent"></div>
  </section>

  <!-- CUOTA -->
  <section class="screen" data-screen="cuota" hidden>
    <header class="topbar">
      <h1 class="title">Mi cuota</h1>
      <span class="meta"></span>
    </header>
    <div class="construction">
      <div class="barrier">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16h.01M10.3 3.9L2.7 17.5c-.6 1 .1 2.2 1.2 2.2h16.2c1.1 0 1.8-1.2 1.2-2.2L13.7 3.9c-.6-1-2-1-2.6 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Esta función está en construcción</h2>
      <p>Muy pronto vas a poder ver el estado de tu cuota y pagarla desde acá.</p>
      <button type="button" class="btn ghost" data-action="nav" data-screen="hoy">Volver a Hoy</button>
    </div>
  </section>

  <!-- ADMIN (solo con ?admin=1, sin link desde la UI) -->
  <section class="screen" data-screen="admin" hidden>
    <header class="topbar">
      <h1 class="title">Admin</h1>
      <span class="meta">equipo</span>
    </header>
    <div class="content" id="adminContent"></div>
  </section>

  <nav class="navbar" id="navbar" aria-label="Secciones"></nav>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
